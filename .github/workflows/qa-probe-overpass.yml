name: QA direct OSM map API probe (no user location)
on:
  push:
    branches: [qa/vuelos-uruguay-overpass-probe-20261103]
    paths: ['.github/workflows/qa-probe-overpass.yml']
permissions:
  contents: read
jobs:
  osm-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query small public OSM bounding box
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          # Small representative Montevideo city-center area, not the user's location.
          url='https://api.openstreetmap.org/api/0.6/map?bbox=-56.1935,-34.9063,-56.1925,-34.9057'
          print('PROBE',url,flush=True)
          try:
              req=urllib.request.Request(url,headers={
                  'User-Agent':'VuelosUruguay-QA/1.14 (public map coverage probe)',
                  'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=28) as r:
                  body=r.read(3000000)
                  print('HTTP',r.status,'BYTES',len(body),'CONTENT_TYPE',r.headers.get('Content-Type'),flush=True)
              j=json.loads(body)
              ways=[w for w in j.get('elements',[]) if w.get('type')=='way' and 'highway' in w.get('tags',{})]
              tagged=[w for w in ways if w.get('tags',{}).get('maxspeed')]
              print('WAYS',len(ways),'WITH_MAXSPEED',len(tagged),'UNTAGGED',len(ways)-len(tagged),flush=True)
              print('SAMPLE',[(w.get('tags',{}).get('name',''),w.get('tags',{}).get('maxspeed','')) for w in ways[:15]],flush=True)
          except urllib.error.HTTPError as e:
              print('HTTP_ERROR',e.code,e.read(300).decode('utf8','replace'),flush=True)
          except Exception as e:
              print('ERROR',str(e)[:300],flush=True)
          PY
