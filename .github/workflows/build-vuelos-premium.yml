name: Vuelos Uruguay Premium 1.2 - Android APK
on:
  push:
    branches: [qa/vuelos-uruguay-premium-20261102]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-vuelos-premium.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" Vuelos-Uruguay-Premium-v1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" | tee firma.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee paquete.txt
          grep -F "package: name='uy.vuelos.uruguay'" paquete.txt
          grep -F "versionName='1.2'" paquete.txt
          sha256sum Vuelos-Uruguay-Premium-v1.2.apk | tee SHA256SUMS.txt
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Vuelos-Uruguay-Premium-v1.2-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            Vuelos-Uruguay-Premium-v1.2.apk
            SHA256SUMS.txt
            firma.txt
            paquete.txt
      - name: Publish QA Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create vuelos-uruguay-premium-v1.2-20261102 Vuelos-Uruguay-Premium-v1.2.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Vuelos Uruguay Premium v1.2 - Android' --notes 'APK independiente, solo Carrasco. Nuevo icono vectorial y aspecto premium. Actualiza el panel cada 3 minutos mientras está abierta (configurable). Fuente externa Avionio, no son datos push. Firma de prueba: desinstalar la anterior antes de instalar. Sin cambios en Quick Trip.'
