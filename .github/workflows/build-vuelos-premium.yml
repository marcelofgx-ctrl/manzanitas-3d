name: Vuelos Uruguay 1.18.0 - Stable offline map matching and readable street label
on:
  push:
    branches: [qa/vuelos-uruguay-map-stability-v118-20261103]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-vuelos-premium.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build bounded offline Uruguay speed-limit map
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet osmium
          curl --fail --location --retry 3 --retry-delay 3 \
            --connect-timeout 15 --max-time 240 \
            "https://download.geofabrik.de/south-america/uruguay-latest.osm.pbf" \
            --output /tmp/uruguay-latest.osm.pbf
          test "$(stat -c%s /tmp/uruguay-latest.osm.pbf)" -gt 30000000
          mkdir -p app/src/main/assets
          python3 tools/build_offline_uy_roads.py \
            /tmp/uruguay-latest.osm.pbf \
            app/src/main/assets/uy_roads_offline.zip
          unzip -t app/src/main/assets/uy_roads_offline.zip | tail -n 2
          python3 - <<'PY'
          import zipfile,json,math
          p='app/src/main/assets/uy_roads_offline.zip'
          with zipfile.ZipFile(p) as z:
              a,b=math.floor(-34.906*100),math.floor(-56.193*100)
              t=f'{a}_{b}.json'
              rows=json.loads(z.read(t))
              numbers=[r[2] for r in rows if r[2]>0]
              print('CENTRO_REFERENCE_TILE',t,'ROAD_SEGMENTS',len(rows),
                    'SPEED_TAGS',len(numbers),'SAMPLE_LIMITS',sorted(set(numbers)),flush=True)
              if len(rows)<10 or not numbers:
                  raise SystemExit('Offline data must include mapped speed limits in reference Centro cell')
          PY
      - name: Build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Validate APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" Vuelos-Uruguay-Conductor-v1.18.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" | tee firma.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee paquete.txt
          grep -F "package: name='uy.vuelos.uruguay'" paquete.txt
          grep -F "versionName='1.18.0'" paquete.txt
          sha256sum Vuelos-Uruguay-Conductor-v1.18.0.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vuelos-Uruguay-Conductor-v1.18.0
          if-no-files-found: error
          retention-days: 30
          path: |
            Vuelos-Uruguay-Conductor-v1.18.0.apk
            SHA256SUMS.txt
            firma.txt
            paquete.txt
            app/build/test-results/testDebugUnitTest/
      - name: Publish signed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vuelos-uruguay-conductor-v1.18.0-20261103 Vuelos-Uruguay-Conductor-v1.18.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Vuelos Uruguay Conductor v1.18.0' --notes 'QA: matching local mejorado para Avenida Italia y cruces: combina segmentos de una misma calle OSM, utiliza rumbo GPS preciso para distinguir transversales sin adivinar velocidades, conserva N/D si hay ambigüedad real. Nombre de calle 14sp y cápsula más legible. Quick Trip intacto.'
