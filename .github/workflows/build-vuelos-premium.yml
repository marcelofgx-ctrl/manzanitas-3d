name: Vuelos Uruguay 1.3 - Driver cockpit and local alerts
on:
  push:
    branches: [qa/vuelos-uruguay-premium-20261102]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-vuelos-premium.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" Vuelos-Uruguay-Conductor-v1.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" | tee firma.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee paquete.txt
          grep -F "package: name='uy.vuelos.uruguay'" paquete.txt
          grep -F "versionName='1.3'" paquete.txt
          sha256sum Vuelos-Uruguay-Conductor-v1.3.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vuelos-Uruguay-Conductor-v1.3
          if-no-files-found: error
          retention-days: 30
          path: |
            Vuelos-Uruguay-Conductor-v1.3.apk
            SHA256SUMS.txt
            firma.txt
            paquete.txt
      - name: Publish signed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vuelos-uruguay-conductor-v1.3-20261102 Vuelos-Uruguay-Conductor-v1.3.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Vuelos Uruguay Conductor v1.3' --notes 'Pantalla de arribos cercanos, códigos compartidos agrupados, alertas Android optativas con sonido y vibración basadas en última consulta. No son push ni llegan de datos en vivo en background. Puede usarse fuente original si cambia su estructura. QA: requiere verificación en Samsung. Sin cambios a Quick Trip.'
