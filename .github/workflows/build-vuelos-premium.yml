name: Vuelos Uruguay 1.24.0 - Startup permissions and expandable speed capsule QA
on:
  push:
    branches: [qa/vuelos-uruguay-startup-permissions-capsule-v124-20261104]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-vuelos-premium.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build bounded offline Uruguay speed-limit map
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet osmium
          curl --fail --location --retry 3 --retry-delay 3 \
            --connect-timeout 15 --max-time 240 \
            "https://download.geofabrik.de/south-america/uruguay-latest.osm.pbf" \
            --output /tmp/uruguay-latest.osm.pbf
          test "$(stat -c%s /tmp/uruguay-latest.osm.pbf)" -gt 30000000
          mkdir -p app/src/main/assets
          python3 tools/build_offline_uy_roads.py \
            /tmp/uruguay-latest.osm.pbf \
            app/src/main/assets/uy_roads_offline.zip
          unzip -t app/src/main/assets/uy_roads_offline.zip | tail -n 2
          python3 - <<'PY'
          import zipfile,json,math
          p='app/src/main/assets/uy_roads_offline.zip'
          with zipfile.ZipFile(p) as z:
              a,b=math.floor(-34.906*100),math.floor(-56.193*100)
              t=f'{a}_{b}.json'
              rows=json.loads(z.read(t))
              numbers=[r[2] for r in rows if r[2]>0]
              print('CENTRO_REFERENCE_TILE',t,'ROAD_SEGMENTS',len(rows),
                    'SPEED_TAGS',len(numbers),'SAMPLE_LIMITS',sorted(set(numbers)),flush=True)
              if len(rows)<10 or not numbers:
                  raise SystemExit('Offline data must include mapped speed limits in reference Centro cell')
          PY
      - name: Validate expandable capsule and automatic permission onboarding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('app/src/main/java/uy/vuelos/uruguay/RoadSpeedPanel.java').read_text()
          main=Path('app/src/main/java/uy/vuelos/uruguay/MainActivity.java').read_text()
          assert 'private void setExpanded(boolean expand)' in ui
          assert 'setExpanded(false);' in ui
          assert 'capsuleHeader.setOnClickListener(v->setExpanded(!expanded))' in ui
          assert 'streetSummary.setText(speed+" / "+limit)' in ui
          assert 'details.setVisibility(expand?View.VISIBLE:View.GONE)' in ui
          assert 'gpsToggle' not in ui
          assert 'warningToggle' not in ui
          assert 'toggleGPS()' not in ui
          assert 'private void beginStartupPermissions()' in main
          assert 'requestLocationAtStart()' in main
          assert 'requestNotificationsAtStart()' in main
          assert 'shouldShowRequestPermissionRationale' in main
          assert 'roadSpeedPanel.permissionResult(result)' in main
          assert 'enableNewInstallFlightAlerts()' in main
          assert 'permissionsCheckedThisForeground=false' in main
          print('QA_CAPSULE_PERMISSION_OK: compact expandable header, startup Android grants, retry on reopen')
          PY
      - name: Verify visual-only compact layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          board=Path('app/src/main/java/uy/vuelos/uruguay/DriverBoard.java').read_text()
          screen=Path('app/src/main/java/uy/vuelos/uruguay/MainActivity.java').read_text()
          road=Path('app/src/main/java/uy/vuelos/uruguay/RoadSpeedPanel.java').read_text()
          assert 'section("FECHA · "' not in board
          assert 'section("PRÓXIMOS 90 MIN",null)' in board
          assert 'section("MÁS TARDE",null)' in board
          assert 'localTime.setText(localDate()' in screen
          assert 'label("MOVIMIENTOS DE VUELOS"' in screen
          assert 'duplicateMappedCaption?View.GONE:View.VISIBLE' in road
          assert 'visual==SpeedColorPolicy.RED' in road
          print('QA_VISUAL_COMPACT_OK: date once, condensed flight list, alerts retained')
          PY
      - name: Verify offline prefetch and no false speed carryover
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/java/uy/vuelos/uruguay/OfflineRoadLookup.java').read_text()
          ui=Path('app/src/main/java/uy/vuelos/uruguay/RoadSpeedPanel.java').read_text()
          assert 'warmAround(a,b)' in src
          assert 'scheduleRead(aa,bb)' in src
          assert 'MAX_CACHED_TILES=24' in src
          assert 'lastServedKey' in src
          assert 'limitValue=text("—"' in ui
          assert 'currentLimit=match.confident?match.limitKmh:0' in ui
          assert 'visual==SpeedColorPolicy.RED' in ui
          print('QA_OFFLINE_LIMIT_STABILITY_OK: prefetch, bounded cache, current fix, safe unknown display')
          PY
      - name: Build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Validate APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" Vuelos-Uruguay-Conductor-v1.24.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" | tee firma.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee paquete.txt
          grep -F "package: name='uy.vuelos.uruguay'" paquete.txt
          grep -F "versionName='1.24.0'" paquete.txt
          sha256sum Vuelos-Uruguay-Conductor-v1.24.0.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vuelos-Uruguay-Conductor-v1.24.0
          if-no-files-found: error
          retention-days: 30
          path: |
            Vuelos-Uruguay-Conductor-v1.24.0.apk
            SHA256SUMS.txt
            firma.txt
            paquete.txt
            app/build/test-results/testDebugUnitTest/
      - name: Publish signed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=vuelos-uruguay-conductor-v1.24.0-20261104
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Vuelos-Uruguay-Conductor-v1.24.0.apk SHA256SUMS.txt --clobber
          else
            gh release create "$tag" Vuelos-Uruguay-Conductor-v1.24.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Vuelos Uruguay Conductor v1.24.0' --notes 'QA v1.24: permisos de ubicación y notificaciones al abrir, reintento en siguiente entrada y cápsula plegable de calle, velocidad y límite; controles GPS/VIB retirados. Sin cambios en motores de vuelos, límites, Quick Trip o producción.'
          fi
